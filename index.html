<title>Krishna Kuteer</title>
<style>
:root{--navy:#12294f;--blue:#2559c7;--sky:#eaf1fd;--grey:#5b6778;--line:#e1e7f0;--bg:#f3f6fb;--red:#c0362c;--green:#15803d;--amber:#b45309;--ink:#16202f;--r:14px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0f2447,#1c4586);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(15,36,71,.25)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:1.02rem;display:block;line-height:1.2}.brand small{opacity:.8;text-transform:capitalize;font-size:.78rem}
.logo{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;letter-spacing:.5px;flex:none}
header button.ghost{background:rgba(255,255,255,.14);color:#fff;padding:8px 12px;font-size:.85rem}header button.ghost:hover{background:rgba(255,255,255,.26)}
main{max-width:820px;margin:0 auto;padding:18px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,32,60,.04),0 4px 14px rgba(16,32,60,.04)}
.hero{background:linear-gradient(135deg,#12294f,#2559c7);color:#fff;border:0}.hero small{color:rgba(255,255,255,.82)}.hero .big{color:#fff}
.big{font-size:2.1rem;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.2;margin:2px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0;border-top:3px solid var(--blue)}.grid .card:nth-child(2){border-top-color:var(--amber)}
.grid b{display:block;font-size:1.4rem;font-weight:800;color:var(--navy);letter-spacing:-.3px}.grid span{color:var(--grey);font-size:.82rem}
h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);font-weight:700;margin:22px 0 10px}
input,select,button{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--line);width:100%;background:#fff;transition:background-color .15s,border-color .15s,transform .1s}
input:hover,select:hover{border-color:#b9c5d8}
button{background:var(--navy);color:#fff;border:0;font-weight:600;cursor:pointer}button:hover{background:#1c3f78}button:active{transform:translateY(1px)}
button.ghost{background:var(--sky);color:var(--navy)}button.ghost:hover{background:#d9e6fb}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(37,89,199,.35);outline-offset:1px;border-color:var(--blue)}
input[type=month]{max-width:220px}
.msel{position:relative}.msel>summary{list-style:none;cursor:pointer;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}.msel>summary::-webkit-details-marker{display:none}.msel>summary:after{content:"▾";color:var(--grey)}.msel[open]>summary{border-color:var(--navy)}.msel .mp{margin-top:4px;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:230px;overflow:auto;padding:4px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px}.msel .mp label{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;cursor:pointer}.msel .mp label:hover{background:var(--sky)}.msel .mp input{width:auto;padding:0;margin:0;accent-color:var(--navy)}.tsel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.f .w{grid-column:1/-1}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}.it:last-child{border:0}.it small{display:block;color:var(--grey);font-size:.82rem;line-height:1.45}
.it button{width:auto;padding:7px 12px;font-size:.82rem}
.badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:99px}
.PAID{color:var(--green);background:#e4f6ea}.PARTIAL{color:var(--amber);background:#fdf0dc}.PENDING{color:var(--red);background:#fde8e6}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav button{background:none;color:var(--grey);border-radius:12px;padding:7px 4px;flex:1;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--bg)}nav button.on{color:var(--blue);background:var(--sky)}
.login{max-width:380px;margin:9vh auto;padding:28px}.login .logo{margin:0 auto 12px;width:58px;height:58px;font-size:1.25rem;background:var(--navy);color:#fff}
.login h2{text-transform:none;letter-spacing:0;font-size:1.3rem;color:var(--ink);text-align:center;margin:0 0 4px}.login .sub{text-align:center;color:var(--grey);margin:0 0 18px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#16202f;color:#fff;padding:11px 18px;border-radius:12px;display:none;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;font-size:.9rem}
.err{color:var(--red);font-size:.88rem;min-height:1.2em}
input,select{color:var(--ink);-webkit-text-fill-color:var(--ink);background-color:#fff;opacity:1}input::placeholder{color:#7a8596;-webkit-text-fill-color:#7a8596}
label.fl{display:block;font-size:.78rem;color:var(--grey);font-weight:600;margin-bottom:3px}
.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.login{overflow:hidden}.login .hero-img{display:block;width:calc(100% + 56px);height:190px;object-fit:cover;margin:-28px -28px 0}.login .hero-img+.logo{margin:-30px auto 12px;position:relative;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.regwrap{border:1px solid var(--line);border-radius:12px;padding:6px}
.COMPLETED{color:var(--green);background:#e4f6ea}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);white-space:nowrap}.tbl .r{text-align:right;white-space:nowrap}.tbl tfoot td{font-weight:800;background:var(--sky);border-bottom:0}.tbl select{padding:6px 8px;min-width:112px}.tbl button{width:auto;padding:6px 10px;font-size:.8rem}
nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:68px}
@media(min-width:900px){body{padding-bottom:30px}nav{top:62px;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line);background:#fff}
nav button{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:.92rem;justify-content:flex-start}main{margin:0 0 0 232px;max-width:none;padding:26px 36px}main>*{max-width:880px}#toast{bottom:30px}}

/* ===== Mobile-friendly layer ===== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:clip}
img{max-width:100%}
.menubtn{display:none;width:42px;height:42px;padding:0;flex:none;background:rgba(255,255,255,.14);color:#fff;border-radius:11px;align-items:center;justify-content:center}
.menubtn:hover{background:rgba(255,255,255,.26)}
.menubtn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.menubtn .x{display:none}body.menu-open .menubtn .x{display:block}body.menu-open .menubtn .l{display:none}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navfoot,.navhead,#scrim{display:none}
@media(max-width:899px){
 body{padding-bottom:20px}
 header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
 .menubtn{display:flex}
 .hdr-actions{display:none}
 #scrim{display:block;position:fixed;inset:0;background:rgba(10,20,40,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
 body.menu-open #scrim{opacity:1;pointer-events:auto}
 body.menu-open{overflow:hidden}
 nav{position:fixed;top:0;bottom:0;left:0;right:auto;width:min(82vw,300px);flex-direction:column;justify-content:flex-start;gap:4px;overflow-y:auto;overflow-x:hidden;background:#fff;border-top:0;border-right:1px solid var(--line);padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .28s ease;z-index:50;box-shadow:none;backdrop-filter:none}
 body.menu-open nav{transform:none;box-shadow:8px 0 30px rgba(10,20,40,.25)}
 nav .navhead{display:flex;align-items:center;gap:10px;margin:0 -12px 10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(135deg,#0f2447,#1c4586);color:#fff}
 nav .navhead .logo{width:38px;height:38px}
 nav .navhead b{display:block;line-height:1.2}nav .navhead small{opacity:.8;text-transform:capitalize;font-size:.78rem}
 nav button[data-t]{flex:none;flex-direction:row;gap:14px;padding:13px 14px;font-size:1rem;justify-content:flex-start;min-width:0;width:100%;text-align:left}
 nav button svg{width:22px;height:22px}
 nav .navfoot{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
 nav .navfoot button{flex:none;flex-direction:row;justify-content:center;font-size:.95rem;padding:12px;color:var(--navy);background:var(--sky)}
 nav .navfoot button.so{background:#fde8e6;color:var(--red)}
 main{padding:14px 12px}
 .card{padding:14px}
 .big{font-size:1.8rem}
 #toast{bottom:24px}
 .tw,.regwrap{-webkit-overflow-scrolling:touch}
 input,select{font-size:16px} /* stops iOS auto-zoom on focus */
 button,.it button{min-height:40px}
 input[type=month]{max-width:none;width:100%}
 .login{margin:4vh auto;max-width:94%}
}
@media(max-width:520px){
 .f{grid-template-columns:1fr}
 .grid{gap:10px}.grid b{font-size:1.2rem}
 .it{flex-wrap:wrap}
 .it>div:first-child{min-width:0;flex:1 1 150px;overflow-wrap:anywhere}
 .brand b{font-size:.98rem}
 h2{margin:18px 0 8px}
 .tbl{font-size:.82rem}.tbl th,.tbl td{padding:8px 6px}
}
@media(min-width:900px){.navhead,.navfoot{display:none!important}}
/* ===== Motion layer: transform/opacity only (GPU-friendly), no libraries ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}60%{transform:scale(1.08)}}
@keyframes shim{to{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes nbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes ring{from{opacity:.45;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}}
/* first-paint splash (pure CSS, shows before JS runs) */
.splash{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:fadeIn .3s .15s backwards}
.sp-logo{position:relative;width:64px;height:64px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;letter-spacing:.5px;margin-bottom:10px;animation:bob 1.8s ease-in-out infinite}
.sp-logo::after{content:"";position:absolute;inset:0;border-radius:18px;border:2px solid var(--blue);animation:ring 1.6s ease-out infinite}
.splash b{color:var(--navy);font-size:1.1rem}.splash small{color:var(--grey)}
.sp-bar{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:16px}
.sp-bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--blue);animation:nbar 1s ease-in-out infinite}
/* thin network bar at the top while saving / loading */
#nb{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#nb.on{opacity:1}#nb i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,transparent,#5b8def,#2559c7)}
#nb.on i{animation:nbar 1s ease-in-out infinite}
/* page entrance: tab change = staggered rise, same-tab refresh = soft fade */
.enter>*{animation:fadeUp .26s cubic-bezier(.22,.8,.3,1) backwards}
.enter>:nth-child(2){animation-delay:.03s}.enter>:nth-child(3){animation-delay:.06s}.enter>:nth-child(n+4){animation-delay:.09s}
.soft>*{animation:fadeIn .2s backwards}
/* skeleton placeholders instead of "Loading…" */
.sk{display:grid;gap:14px}.sk-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk-b{position:relative;overflow:hidden;background:#e4eaf4;border-radius:var(--r);height:84px}
.sk-b::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shim 1.3s infinite}
/* login */
.login{animation:fadeUp .5s cubic-bezier(.22,.8,.3,1) backwards}.login.shake{animation:shake .45s}
.login .hero-img{background:linear-gradient(135deg,#12294f,#2559c7);opacity:0;transition:opacity .5s}.login .hero-img.ld{opacity:1}
/* small touches */
.big,.grid b{font-variant-numeric:tabular-nums}
button:active{transform:scale(.97)}
.badge{animation:pop .4s backwards}
nav button.on svg{animation:pop .35s}
#toast{animation:toastIn .25s cubic-bezier(.22,.8,.3,1)}
.modal{animation:fadeIn .2s}.modal>.card{animation:modalIn .26s cubic-bezier(.22,.8,.3,1)}
button.busy{position:relative;color:transparent!important;-webkit-text-fill-color:transparent;pointer-events:none}
button.busy::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
button.ghost.busy::after{border-color:rgba(18,41,79,.25);border-top-color:var(--navy)}
@media(hover:hover){.grid .card{transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,32,60,.1)}}
@media(max-width:899px){body.menu-open nav>*{animation:slideIn .32s cubic-bezier(.22,.8,.3,1) backwards}body.menu-open nav>:nth-child(2){animation-delay:0.03s}body.menu-open nav>:nth-child(3){animation-delay:0.06s}body.menu-open nav>:nth-child(4){animation-delay:0.09s}body.menu-open nav>:nth-child(5){animation-delay:0.12s}body.menu-open nav>:nth-child(6){animation-delay:0.15s}body.menu-open nav>:nth-child(7){animation-delay:0.18s}body.menu-open nav>:nth-child(8){animation-delay:0.21s}body.menu-open nav>:nth-child(9){animation-delay:0.24s}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

.brand,.navhead{cursor:pointer}.wel{margin:2px 0 14px}.wel h1{font-size:1.35rem;font-weight:800;color:var(--navy);margin:0;letter-spacing:-.3px}.wel small{color:var(--grey)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:#fff;color:var(--navy);border:1px solid var(--line);font-size:.78rem;font-weight:600;box-shadow:0 1px 2px rgba(16,32,60,.04)}.qa button span{font-size:1.4rem;line-height:1}.qa button:hover{border-color:var(--blue);background:var(--sky)}
.nt{border-left:4px solid #2f6fe0;padding:12px 14px}.nt small{display:block;color:var(--grey)}
@media(max-width:520px){.qa{grid-template-columns:repeat(3,1fr)}.qa.q4{grid-template-columns:repeat(2,1fr)}}

.wel .sub2{display:block;color:var(--grey);font-size:.85rem}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:.78rem;font-weight:600;cursor:default}.stg button.ed{cursor:pointer}.stg i{font-style:normal;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.tl{border-left:2px solid var(--line);margin:0 0 0 8px;padding:0 0 0 14px}.tl div{position:relative;padding:0 0 12px}.tl div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff}.tl small{display:block;color:var(--grey)}
.ev{display:flex;gap:12px;align-items:center}.ev .d{min-width:52px;text-align:center;background:var(--sky);color:var(--navy);border-radius:10px;padding:6px 4px;font-weight:800;line-height:1.1}.ev .d small{display:block;font-size:.65rem;font-weight:700;text-transform:uppercase}
.stp{display:flex;gap:6px;margin:8px 0 2px}.stp span{flex:1;height:5px;border-radius:9px;background:var(--line)}.stp span.on{background:var(--green)}
.bar{background:var(--sky);border-radius:9px;overflow:hidden;margin:4px 0}.bar div{background:var(--blue);color:#fff;font-size:.78rem;padding:5px 9px;white-space:nowrap;min-width:fit-content}.bar.me div{background:var(--green)}
.prt{display:flex;justify-content:flex-end;margin:-4px 0 10px}.prt button{width:auto;padding:7px 12px;font-size:.85rem}
#prn{display:none}
@media print{body.printing>*:not(#prn){display:none!important}body.printing{background:#fff!important;padding:0!important;margin:0!important;overflow:visible!important;height:auto!important}body.printing #prn{display:block!important}}
/* ===== Rich motion layer v2 (CSS + ~1.5 KB JS, no libraries) ===== */
@keyframes aur{0%{transform:translate3d(-6%,-4%,0) scale(1)}50%{transform:translate3d(8%,6%,0) scale(1.15)}100%{transform:translate3d(-6%,-4%,0) scale(1)}}
@keyframes aur2{0%{transform:translate3d(6%,8%,0)}50%{transform:translate3d(-8%,-6%,0) scale(1.2)}100%{transform:translate3d(6%,8%,0)}}
@keyframes flow{to{background-position:200% 0}}
@keyframes sheen{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
@keyframes tilePop{from{opacity:0;transform:translateY(18px) scale(.82) rotate(-3deg)}60%{transform:translateY(-3px) scale(1.04)}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes drip{0%,100%{transform:translateY(-2px)}50%{transform:translateY(4px) scaleY(1.1)}}
@keyframes lift{0%,100%{transform:translateY(5px)}50%{transform:translateY(-6px)}}
@keyframes gen{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #fbbf24)}50%{transform:scale(1.14);filter:drop-shadow(0 0 6px #fbbf24)}}
@keyframes zap{0%,100%{opacity:1}6%{opacity:.35}9%{opacity:1}52%{opacity:1}55%{opacity:.4}58%{opacity:1}}
@keyframes guard{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-4deg);filter:drop-shadow(0 0 6px #5b8def)}}
@keyframes sweep{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes pan{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.1}}
@keyframes beam{0%,100%{transform:translateX(-100%)}50%{transform:translateX(330%)}}
@keyframes sun{to{transform:rotate(360deg)}}
@keyframes spark{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes ripple{from{transform:scale(0);opacity:.35}to{transform:scale(1);opacity:0}}
@keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(12deg)}}
body::before,body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.55}

/* motion helpers: top network bar + spinner on the button you just pressed */
let NB=0,NBT=null,CB=null,CBT=0;const NBE=document.getElementById("nb");
const netStart=()=>{if(NB++===0)NBT=setTimeout(()=>{NBE.classList.add("on");document.getElementById("ck").classList.add("on")},200)},netEnd=()=>{if(--NB<=0){NB=0;clearTimeout(NBT);NBE.classList.remove("on");document.getElementById("ck").classList.remove("on")}};
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");CB=b&&b.closest("main,.login,.modal")?b:null;CBT=Date.now()},true);
async function api(body,bg){let r;
 if(!bg)netStart();const cb=!bg&&CB&&CB.isConnected&&Date.now()-CBT<600&&!CB.classList.contains("busy")?CB:null;if(cb)cb.classList.add("busy");
 try{r=await(await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({token:TOK,...body})})).json()}
 catch(e){throw new Error("Could not reach Google Sheets. Check your internet connection and try again.")}
 finally{if(!bg)netEnd();if(cb)cb.classList.remove("busy")}
 if(r.auth){setTok(null);dropCache();cur=null;SNAP=null;loginView(r.error.message);throw new Error(r.error.message)}return r}
const SK="kk_snap",FRESH=20000;let DIRTY=false,REFR=false,GEN=0;
const readCache=()=>{try{const c=JSON.parse(localStorage.getItem(SK)||"null");if(c&&c.tok&&c.tok===TOK)return c.d}catch(e){}return null};
const saveCache=d=>{try{localStorage.setItem(SK,JSON.stringify({tok:TOK,d}))}catch(e){}};
const dropCache=()=>{try{localStorage.removeItem(SK)}catch(e){}};
const getSnap=bg=>api({a:"snapshot"},bg).then(r=>{if(r.error)throw new Error(r.error.message);return r.data});
function adopt(d){SNAP=Promise.resolve(d);SNAPT=Date.now();DIRTY=false;saveCache(d);if(d&&d.me&&cur)cur=d.me}
/* Show what we already have instantly, then quietly fetch the latest in the background. */
function refresh(){if(REFR)return;REFR=true;const old=SNAP,g=GEN;
 getSnap(1).then(async d=>{if(g!==GEN)return;const prev=await old;adopt(d);
  if(JSON.stringify(prev)!==JSON.stringify(d)&&me&&$("#m")&&!document.querySelector("input:focus,select:focus"))render()})
 .catch(()=>{}).finally(()=>{REFR=false})}
function snap(){
 if(SNAP){if(Date.now()-SNAPT<FRESH)return SNAP;refresh();return SNAP}
 if(!DIRTY){const c=readCache();if(c){SNAP=Promise.resolve(c);SNAPT=0;refresh();return SNAP}}
 SNAP=getSnap().then(d=>{DIRTY=false;saveCache(d);return d}).catch(e=>{SNAP=null;throw e});SNAPT=Date.now();return SNAP}
function Q(t){const f=[],fl=[];let op="s",pl=null,one=0,ord=null;const q={
 select(){return q},eq(c,v){f.push(r=>String(r[c])===String(v));fl.push([c,v]);return q},gte(c,v){f.push(r=>r[c]>=v);return q},lt(c,v){f.push(r=>r[c]<v);return q},
 in(c,v){f.push(r=>v.includes(r[c]));return q},order(c,o){ord=[c,o&&o.ascending===false];return q},single(){one=1;return q},maybeSingle(){one=2;return q},
 insert(v){op="insert";pl=v;return q},update(v){op="update";pl=v;return q},delete(){op="delete";return q},upsert(v,o){op="upsert";pl=[v,o];return q},
 then(res,rej){return run().then(res,rej)}};
 async function run(){
  if(op==="s"){const T=await snap();let r=(T[t]||[]).filter(x=>f.every(g=>g(x))).map(x=>({...x}));
   if(cur&&cur.role==="resident"&&t==="flats")r=r.filter(x=>x.id===cur.flat);
   if(ord)r.sort((x,y)=>(x[ord[0]]>y[ord[0]]?1:-1)*(ord[1]?-1:1));
   return{data:one?(r[0]||null):r,error:null}}
  try{const up=op==="upsert",w=await api({a:"write",t,op,payload:up?pl[0]:pl,onConflict:up?pl[1].onConflict:null,filters:fl});GEN++;if(w.snapshot)adopt(w.snapshot);else{SNAP=null;DIRTY=true}
   return{data:null,error:w.error||null}}catch(e){return{data:null,error:{message:e.message}}}}
 return q}
const db={from:Q,rpc:async n=>({data:n==="all_flats"?(await snap()).flats.map(x=>({...x})):null,error:null}),auth:{
 getUser:async()=>{if(!cur&&TOK){try{const T=await snap();if(T&&T.me)cur=T.me;else{const r=await api({a:"me"});if(r.user)cur=r.user}}catch(e){}}
  return{data:{user:cur?{id:cur.id,email:cur.email,user_metadata:{pw_changed:!!cur.pw_changed}}:null}}},
 updateUser:async({password})=>{try{const r=await api({a:"pw",password});if(r.error)return{error:r.error};cur.pw_changed=true;SNAP=null;DIRTY=true;dropCache();return{error:null}}catch(e){return{error:{message:e.message}}}},
 emailSend:async email=>{try{const r=await api({a:"emailSend",email});return r.error?{error:r.error}:{error:null}}catch(e){return{error:{message:e.message}}}},
 emailVerify:async code=>{try{const r=await api({a:"emailVerify",code});if(r.error)return{error:r.error};cur.email_ok=true;cur.real_email=r.email;SNAP=null;DIRTY=true;dropCache();return{error:null}}catch(e){return{error:{message:e.message}}}},
 fpSend:async u=>{try{const r=await api({a:"fpSend",u});return r.error?{error:r.error}:{error:null,masked:r.masked}}catch(e){return{error:{message:e.message}}}},
 fpReset:async(u,code,password)=>{try{const r=await api({a:"fpReset",u,code,password});return{error:r.error||null}}catch(e){return{error:{message:e.message}}}},
 signOut:async()=>{try{await api({a:"logout"})}catch(e){}setTok(null);dropCache();cur=null;SNAP=null},
 signInWithPassword:async({email,password})=>{try{const r=await api({a:"login",u:email,p:password,dev:((navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac OS X|Linux/)||["Device"])[0]+" "+(navigator.userAgent.match(/Edg|OPR|Firefox|Chrome|Safari/)||[""])[0]).trim()});if(r.error)return{error:r.error};setTok(r.token);cur=r.user;SNAP=null;if(r.snapshot)adopt(r.snapshot);return{error:null}}catch(e){return{error:{message:e.message}}}}}};

function countUp(root){root.querySelectorAll(".hero .big,.grid b").forEach(el=>{const m=el.textContent.match(/^([^\d]*)([\d,]+)$/);if(!m)return;const to=+m[2].replace(/,/g,"");if(!to||to>1e9)return;const t0=performance.now();
 const step=n=>{const p=Math.min(1,(n-t0)/450);el.textContent=m[1]+Math.round(to*(1-Math.pow(1-p,3))).toLocaleString("en-IN");if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

 <h2>Visitors count</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px">${[["d","Daily"],["w","Weekly"],["m","Monthly"],["y","Yearly"]].map(([k,l])=>`<button class="${vp===k?"":"ghost"}" data-vp="${k}">${l}</button>`).join("")}</div>
 <div class="card tw"><table class="tbl"><thead><tr><th>${head}</th><th class="r">Visitors</th>${vp==="d"&&canW?"<th></th>":""}</tr></thead><tbody>${list||`<tr><td colspan="3">Nothing yet.</td></tr>`}</tbody></table></div>`;
 document.querySelectorAll("[data-vp]").forEach(b=>b.onclick=()=>{vp=b.dataset.vp;render()});
 if(canW){$("#vs").onclick=async()=>{const d=gd("vd"),n=Math.floor(+$("#vn").value);if(!d)return toast("Enter a valid date (dd/mm/yyyy)");if(!(n>=1))return toast("Enter the number of visitors");

  document.querySelectorAll("[data-vx]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this entry?"))return;const{error}=await db.from("visitors").delete().eq("id",b.dataset.vx);error?toast(error.message):render()})}}

async function meetings(m){
 const can=NOTICE.includes(me.role),{data}=await db.from("meetings").select("*"),today=ld(),L=(data||[]).sort((a,b)=>String(a.on_date).localeCompare(b.on_date)),up=L.filter(e=>String(e.on_date)>=today),pa=L.filter(e=>String(e.on_date)<today).reverse();
 const row=e=>{const t=mdy(e.on_date);return `<div class="card ev"><div class="d">${t.d}<small>${t.m}</small></div><div style="flex:1"><b>${esc(e.title)}</b><small style="display:block;color:var(--grey)">${esc([e.at_time,e.place].filter(Boolean).join(" · "))} · ${e.kind==="event"?"Event":"Meeting"}</small></div>${can?`<button class="ghost" style="width:auto" data-mx="${e.id}">Delete</button>`:""}</div>`};
 m.innerHTML=`${can?`<div class="card"><b>Add meeting or event</b><div class="f"><input id="mt" class="w" placeholder="Title, e.g. Monthly meeting"><input id="md" type="date" value="${today}"><div><label class="fl">Time</label><div class="tsel"><select id="mh1" aria-label="Hour">${Array.from({length:12},(_,i)=>`<option${i+1===6?" selected":""}>${i+1}</option>`).join("")}</select><select id="mh2" aria-label="Minutes">${["00","05","10","15","20","25","30","35","40","45","50","55"].map(x=>`<option>${x}</option>`).join("")}</select><select id="mh3" aria-label="AM or PM"><option>AM</option><option selected>PM</option></select></div></div><input id="mp" class="w" placeholder="Place"><select id="mk" class="w"><option value="meeting">Meeting</option><option value="event">Festival / event</option></select><button class="w" id="ms">Save</button></div></div>`:""}
 <h2>Upcoming</h2>${up.map(row).join("")||`<div class="card">Nothing scheduled yet.</div>`}${pa.length?`<h2>Earlier</h2>${pa.slice(0,5).map(row).join("")}`:""}`;
 if(can){$("#ms").onclick=async()=>{const{error}=await db.from("meetings").insert({title:$("#mt").value.trim(),on_date:$("#md").value,at_time:$("#mh1").value+":"+$("#mh2").value+" "+$("#mh3").value,place:$("#mp").value.trim(),kind:$("#mk").value});error?toast(error.message):render()};
  document.querySelectorAll("[data-mx]").forEach(b=>b.onclick=async()=>{await db.from("meetings").delete().eq("id",b.dataset.mx);render()})}}

async function polls(m){
 const can=NOTICE.includes(me.role),[p,v]=await Promise.all([db.from("polls").select("*").order("id",{ascending:false}),db.from("votes").select("*")]),V=v.data||[];
 m.innerHTML=`${can?`<div class="card"><b>New poll</b><div style="height:8px"></div><input id="pq" placeholder="Question"><div style="height:8px"></div><input id="po" placeholder="Options separated by commas, e.g. Yes, No"><div style="height:8px"></div><button id="pc">Start poll</button></div>`:""}
 ${(p.data||[]).map(q=>{const O=String(q.options).split("|"),my=V.find(x=>String(x.poll_id)===String(q.id)&&x.mine),tot=V.filter(x=>String(x.poll_id)===String(q.id)).length,open=q.status==="open";
  return `<div class="card"><b>${esc(q.question)}</b> <small style="color:var(--grey)">${open?"Open":"Closed"} · ${tot} vote${tot===1?"":"s"}</small>
  ${O.map(o=>{const n=V.filter(x=>String(x.poll_id)===String(q.id)&&x.choice===o).length,pc=tot?Math.round(n/tot*100):0;return my||!open?`<div class="bar${my&&my.choice===o?" me":""}"><div style="width:${Math.max(pc,12)}%">${esc(o)} · ${n} (${pc}%)</div></div>`:`<button class="ghost" style="margin-top:6px" data-v="${q.id}" data-c="${esc(o)}">${esc(o)}</button>`}).join("")}
  ${my?`<small style="color:var(--green)">You voted: ${esc(my.choice)}</small>`:""}${can?`<div class="f" style="margin-top:8px">${open?`<button class="ghost" data-pc="${q.id}">Close poll</button>`:""}<button class="ghost" data-px="${q.id}">Delete</button></div>`:""}</div>`}).join("")||`<div class="card">No polls yet.</div>`}`;
 if(can)$("#pc").onclick=async()=>{const{error}=await db.from("polls").insert({question:$("#pq").value.trim(),options:$("#po").value.split(",").map(x=>x.trim()).filter(Boolean).join("|")});error?toast(error.message):render()};
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{const{error}=await db.from("votes").insert({poll_id:+b.dataset.v,choice:b.dataset.c});error?toast(error.message):render()});
 document.querySelectorAll("[data-pc]").forEach(b=>b.onclick=async()=>{await db.from("polls").update({status:"closed"}).eq("id",b.dataset.pc);render()});
 document.querySelectorAll("[data-px]").forEach(b=>b.onclick=async()=>{await db.from("polls").delete().eq("id",b.dataset.px);render()})}

/* Print this page: prints whatever the screen shows, on the Krishna Kuteer letterhead, without buttons and forms */
const SCR_CSS=`.card{border:1px solid #c5ccd8;border-radius:6px;padding:7px 10px;margin:0 0 7px;page-break-inside:avoid}.card b{font-size:13px}small{display:block;color:#555;font-size:11px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#444;margin:14px 0 5px}.wel h1{font-size:17px;text-align:left;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.grid .card{margin:0}.grid b{display:block;font-size:16px}.it{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding:4px 0}.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stg button{display:block;border:1px solid #c5ccd8;border-radius:6px;background:#fff;color:#16202f;opacity:1;padding:6px 2px;text-align:center;font:inherit;font-weight:600}.stg i{display:block;font-style:normal;font-size:10px;font-weight:700;color:#fff;border-radius:99px;padding:1px 0;margin-top:3px}.stp span{display:inline-block;width:31%;height:5px;background:#ccd3de;margin-right:2%}.stp span.on{background:#15803d}.bar div{background:#d7e2f7;padding:3px 7px;margin:3px 0}.bar.me div{background:#cfeedd}.ev{display:flex;gap:10px;align-items:center}.ev .d{min-width:44px;text-align:center;background:#e8eef9;border-radius:6px;padding:4px;font-weight:800}.ev .d small{font-size:9px;text-transform:uppercase}.tl{border-left:2px solid #c5ccd8;padding-left:12px;margin-left:6px}.tl div{padding-bottom:6px}.nt{border-left:4px solid #2f6fe0}.tw{overflow:visible}`;
function printScreen(m,label){
 const c=m.cloneNode(true),isForm=e=>e.querySelector("input,textarea,select");
 c.querySelectorAll(".prt,.skel,.sk,#toast,.qa").forEach(e=>e.remove());
 c.querySelectorAll("input[type=month]").forEach(e=>e.replaceWith(Object.assign(document.createElement("div"),{innerHTML:"<b>Month: "+esc(e.value)+"</b>"})));
 c.querySelectorAll("button[data-c]").forEach(e=>e.replaceWith(Object.assign(document.createElement("div"),{textContent:"○ "+e.dataset.c})));
 /* strip entry forms but keep the information around them (e.g. the "Maintenance per Flat" amount) */
 c.querySelectorAll(".noprint,datalist").forEach(e=>e.remove());
 const kids=[...c.children];kids.forEach(k=>{if(isForm(k))k.dataset.form="1"});
 c.querySelectorAll(".f").forEach(e=>{if(isForm(e))e.remove()});
 c.querySelectorAll("select").forEach(e=>e.replaceWith(document.createTextNode(e.options[e.selectedIndex]?e.options[e.selectedIndex].text:"")));
 c.querySelectorAll("input,textarea,label.fl,script").forEach(e=>e.remove());
 c.querySelectorAll("button:not(.stg button)").forEach(e=>e.remove());
 c.querySelectorAll(".f").forEach(e=>{if(!e.textContent.trim())e.remove()});
 /* entry-form cards (nothing left but their title) go, together with the heading above them */
 kids.forEach((k,i)=>{if(!c.contains(k)||!k.classList.contains("card")||k.querySelector("img,svg"))return;
  const t=k.textContent.trim();if(t&&!(k.dataset.form&&t.length<30))return;k.remove();
  for(let j=i-1;j>=0;j--){const x=kids[j];if(!c.contains(x))continue;
   if(x.tagName==="P"){x.remove();continue}
   if(x.tagName==="H2")x.remove();break}});
 c.querySelectorAll("[data-form]").forEach(e=>e.removeAttribute("data-form"));
 c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));c.querySelectorAll("[disabled]").forEach(e=>e.removeAttribute("disabled"));
 c.querySelectorAll("a[href]").forEach(e=>{e.removeAttribute("target");e.style.cssText="color:#16202f;text-decoration:none"});
 printHTML(label,`<style>${SCR_CSS}</style>`+sheetHead(label,me.id&&me.role==="resident"?"Flat "+me.id:cap(me.role||""))+c.innerHTML+SIG,m.querySelector(".tbl,table")?true:false)}
function addPrint(m,label){m.insertAdjacentHTML("afterbegin",`<div class="prt"><button class="ghost" id="prs" type="button">🖨 Print this page</button></div>`);$("#prs").onclick=()=>printScreen(m,label)}

/* Instant repeat opens + offline shell: the app files are cached on the phone and refreshed in the background. */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
 addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data==="updated"){const t=$("#toast");t.textContent="New version ready. Tap here to refresh.";t.style.display="block";t.onclick=()=>location.reload();setTimeout(()=>{t.style.display="none";t.onclick=null},9000)}})})}
